services:
  twc3simulator:
    container_name: twc3simulator
    build: https://github.com/lits101/twc3simulator.git#main
    environment:
      # Required — IP of the Tasmota device monitoring your UMC's current draw
      - TASMOTA_IP=10.10.10.10
      # Optional — cosmetic identifiers shown in evcc/Home Assistant.
      # Remove these three lines entirely to use built-in defaults.
      - SERIAL_NUMBER=<your UMC2's actual serial number>
      - PART_NUMBER=<your UMC2's actual part number>
      - FIRMWARE_VERSION=26.34.0+g1a5f79be65b2b4
    ports:
      - 80:80/tcp
    restart: unless-stopped
